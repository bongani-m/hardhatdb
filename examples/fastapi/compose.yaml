# This app and the three-node HardhatDB cluster.
#
# Create certs before the first up: ../gencerts.sh
# This stack publishes the same MySQL ports as the root compose file.
# Stop that stack before starting this one.
#
#	docker compose up --build

name: hardhatdb-fastapi

include:
  - path: ../../compose.yaml

services:
  fastapi:
    build: .
    image: hardhatdb-fastapi
    restart: on-failure
    depends_on:
      - n1
      - n2
      - n3
    networks:
      - vpc
    environment:
      HTTP_ADDR: ":8000"
      MYSQL_ADDRS: n1:3306,n2:3306,n3:3306
      MYSQL_PASSWORD: ${HARDHATDB_BOOTSTRAP_PASSWORD:-dev-only-change-me}
      MYSQL_TLS_CA: /certs/ca.crt
    ports:
      - "8000:8000"
    volumes:
      - ../certs:/certs:ro

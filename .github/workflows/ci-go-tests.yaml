name: Test Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out HardhatDB
        uses: actions/checkout@v4
        with:
          path: hardhatdb

      # Private repo: GITHUB_TOKEN is scoped to hardhatdb and the API
      # returns 404. GMS_DEPLOY_KEY is a read-only deploy key.
      # Pin ft/hooks so CI matches the local engine checkout. The
      # default branch is ft/persist, which still compiles but is an
      # older tree with the persist module still in this repo.
      - name: Check out go-mysql-server
        uses: actions/checkout@v4
        with:
          repository: bongani-m/go-mysql-server
          ref: ft/hooks
          ssh-key: ${{ secrets.GMS_DEPLOY_KEY }}
          path: go-mysql-server

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Install ICU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libicu-dev

      - name: Test
        working-directory: hardhatdb/go
        run: go test ./...

name: Test Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out HardhatDB
        uses: actions/checkout@v4
        with:
          path: hardhatdb

      - name: Check out go-mysql-server
        uses: actions/checkout@v4
        with:
          repository: bongani-m/go-mysql-server
          path: go-mysql-server

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Install ICU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libicu-dev

      - name: Test
        working-directory: hardhatdb/go
        run: go test ./...
